name: Validate docs and publish deck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inside-aspire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deck/package-lock.json
      - name: Restore locked public deck dependencies
        run: npm ci --prefix deck --registry=https://registry.npmjs.org --no-fund --no-audit
      - name: Build the reviewed source
        run: npm run build --prefix deck
      - name: Prepare browser
        run: node deck/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise navigation, mobile, accessibility, print, and asset gates
        run: npm test --prefix deck
      - name: Check manual notification input safeguards
        run: node --test scripts/notify-links.test.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: deck/dist

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify complete unmodified skill trees
        shell: pwsh
        run: ./scripts/Verify-Skills.ps1
      - name: Prepare public isolated CLI
        shell: pwsh
        run: ./scripts/Install-Aspire.ps1
      - name: Validate retrieval and command failure contracts
        shell: pwsh
        run: ./scripts/Test-DocsLoop.ps1 -SkipGitHub

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [deck, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated reviewed deck
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
